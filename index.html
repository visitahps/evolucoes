/* Identidade Merlini Gestão Médica: azul da marca, títulos em serifada slab, textos em geométrica. Layout: lista de leitos -> ficha do paciente em abas; ferramentas avulsas em aba própria. Azul de caneta como único acento; âmbar = achado alterado, vermelho = fora da referência */

  --r:10px;
}

h1{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.15;margin:0;padding-left:14px;border-left:2px solid var(--line);color:var(--ink)}
@media (max-width:480px){.logo{height:34px}h1{font-size:1rem}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{font:inherit;font-size:.88rem;border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opt{font-weight:500;letter-spacing:0;text-transform:none;opacity:.8}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-b{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

.in{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea.in{resize:vertical;line-height:1.5}
.in.mono{font-size:.85rem;white-space:pre;overflow-x:auto;tab-size:10}
select.in{width:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
fieldset.field{border:0;padding:0;margin:0}
fieldset.field legend{padding:0;margin-bottom:5px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.form .wide{grid-column:1/-1}

.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:8px;padding:9px 15px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink);font-weight:500}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad);font-weight:500}
.btn.sm{padding:5px 11px;font-size:.84rem}
.linkbtn{font:inherit;font-size:.85rem;background:none;border:0;color:var(--accent);cursor:pointer;padding:3px 2px;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:.86rem;user-select:none}
.chk input{width:15px;height:15px;margin:0;accent-color:var(--accent)}
.chk:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chk.alt input{accent-color:var(--warn)}
.chk.alt:has(input:checked){background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chk:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* lista */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;align-content:start}
.pcard:hover{border-color:var(--accent)}
.bed{font-family:var(--display);font-size:1.9rem;line-height:1;grid-row:span 4;min-width:2.6ch;font-variant-numeric:tabular-nums;color:var(--accent)}
.pname{font-weight:700;letter-spacing:.01em;overflow-wrap:anywhere}
.pmeta{font-size:.84rem;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* ficha */
.phead{display:flex;flex-direction:column;gap:8px}
.phead h2{font-family:var(--display);font-weight:600;font-size:1.55rem;line-height:1.15;margin:0;overflow-wrap:anywhere}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;border-radius:999px;padding:3px 6px 3px 9px;background:var(--sunk);border:1px solid var(--line)}
.flag button{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;padding:0 3px;font-size:.9rem;line-height:1}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.c-red{background:var(--bad)} .c-amb{background:var(--warn)} .c-grn{background:var(--ok)} .c-blu{background:var(--accent)}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:.92rem;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.status-tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 7px}
.st-alta{background:var(--ok-soft);color:var(--ok)} .st-obito{background:var(--sunk);color:var(--muted)}

.pill{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.est{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 7px;background:var(--warn-soft);color:var(--warn)}
.tag.live{background:var(--accent-soft);color:var(--accent)} .tag.done{background:var(--ok-soft);color:var(--ok)}
.outtext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem;line-height:1.6;margin:0;font-family:var(--body)}
.outtext.placeholder{color:var(--muted)}
.mono-line{font-size:.9rem;line-height:1.55;white-space:pre-wrap;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.impress{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.impress.ok{border-left-color:var(--ok)} .impress.bad{border-left-color:var(--bad)} .impress.est{border-left-color:var(--accent)}
.alerts{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;background:var(--warn-soft);padding:12px 14px}
.alerts h4{margin:0 0 6px;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--warn)}
.status{font-size:.86rem;color:var(--muted);min-height:1.2em}
.status.err{color:var(--warn)}
.thinking::after{content:"..."}
@media (prefers-reduced-motion:no-preference){ .thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite} }
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* exame físico */
.efsys .card-h h3 .opt{font-size:.74rem}
.efpreview{white-space:pre-wrap;font-size:.92rem;line-height:1.6}

/* exames */
.crits{display:flex;flex-wrap:wrap;gap:8px}
.crit{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:4px 10px;font-size:.86rem;font-variant-numeric:tabular-nums}
.crit b{font-weight:700}
.sparks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.spark{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.spark.bad{border-color:var(--bad)}
.spark-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.spark-h span:first-child{font-size:.8rem;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k.startsWith("on")) e[k]=v;
    else if(k==="value") e.value=v;
    else if(k==="checked") e.checked=!!v;
    else e.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); }
  return e;
}

async function callClaude(input,opts){
  opts=opts||{}; const tries=[0,4000,12000]; let last;
  for(let i=0;i<tries.length;i++){
    if(tries[i]){ if(opts.onRetry){try{opts.onRetry(i,tries.length-1)}catch(e){}} await new Promise((res,rej)=>{const t=setTimeout(res,tries[i]); if(opts.signal) opts.signal.addEventListener("abort",()=>{clearTimeout(t);rej({code:"cancelled"})},{once:true})}); }
    try{ return await callClaudeOnce(input,opts) }
    catch(e){ last=e; const retry=e&&(e.code==="rate_limited"||e.code==="upstream_error"||e.code==="empty_completion"||(e.code==="timeout"&&i<1))&&!(e.text&&e.text.trim()); if(!retry) throw e; }
  }
  throw last;
}
async function callClaudeOnce(input,opts){
  const own=new AbortController(); let why=null;
  const kill=(w)=>{why=w; own.abort()};
  if(opts.signal){ if(opts.signal.aborted) own.abort(); else opts.signal.addEventListener("abort",()=>own.abort(),{once:true}) }
  let cur="login";
  const WHY={login:"o login deste aparelho não respondeu",servidor:"o servidor (Supabase) não respondeu",ia:"o servidor conectou, mas a IA não mandou nada",escrevendo:"a IA parou de escrever no meio"};
  const WAIT1=120000, WAIT2=90000;
  let wd=setTimeout(()=>kill((WHY[cur]||"sem resposta")+" em "+WAIT1/1000+" s"),WAIT1);
  const poke=()=>{clearTimeout(wd); wd=setTimeout(()=>kill((WHY[cur]||"sem resposta")+" por "+WAIT2/1000+" s"),WAIT2)};
  try{ return await callClaudeRaw(input,{...opts,signal:own.signal,_poke:poke,_stage:k=>{cur=k}}) }
  catch(e){ if(why&&e&&e.code==="cancelled") throw {code:"timeout",text:e.text,detail:why}; throw e }
  finally{ clearTimeout(wd) }
}
async function callClaudeRaw(input,opts){

  const mark=(k)=>{D.etapa=k; D[k]=((Date.now()-D.at)/1000).toFixed(1); stage(k)};
  stage("login");
  const session=await getSessionSafe(); if(!session) throw {code:"session_expired"};
  mark("servidor");
  const imgs=[]; if(opts.images){const arr=opts.images instanceof Blob?[opts.images]:[...opts.images]; for(const b of arr.slice(0,8)) imgs.push(await prepImage(b))}
  const cfg=getCfg(); let text="", truncated=false, resp;
  try{
    resp=await fetch(cfg.SUPABASE_URL.replace(/\/+$/,"")+"/functions/v1/claude",{method:"POST",signal:opts.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":cfg.SUPABASE_ANON_KEY},
      body:(()=>{const b=JSON.stringify({messages:toMessages(input,imgs),tier:opts.modelTier||"default",max_tokens:opts.maxTokens||16000}); D.chars=b.length; return b})()});
    D.status=resp.status; mark("ia");
  }catch(e){ if(e&&e.name==="AbortError") throw {code:"cancelled",text}; throw {code:"upstream_error",detail:"sem conexão com o Supabase"+(e&&e.message?" · "+e.message:"")} }
  if(!resp.ok){
    let t=""; try{t=await resp.text()}catch(e){}
    const code=resp.status===401?"session_expired":resp.status===403?"not_granted":resp.status===404?"no_function":(resp.status===429||resp.status===529)?"rate_limited":/missing_api_key/.test(t)?"no_key":/credit|billing/i.test(t)?"no_credit":/too long|too large/i.test(t)?"prompt_too_large":"upstream_error";
    throw {code,message:t,detail:errDetail(resp.status,t)};
  }
  const rd=resp.body.getReader(), dec=new TextDecoder(); let buf="";
  if(opts.signal) opts.signal.addEventListener("abort",()=>{try{rd.cancel()}catch(e){}},{once:true});
  try{
    for(;;){
      const {done,value}=await rd.read(); if(done) break; if(opts._poke) opts._poke();
      buf+=dec.decode(value,{stream:true}).replace(/\r/g,"");
      let i; while((i=buf.indexOf("\n\n"))>=0){
        const ev=buf.slice(0,i); buf=buf.slice(i+2);
        const line=ev.split("\n").find(l=>l.startsWith("data:")); if(!line) continue;
        let d; try{d=JSON.parse(line.slice(5).trim())}catch(e){continue}
        if(d.type==="message_start"&&D.inicio===undefined){D.inicio=((Date.now()-D.at)/1000).toFixed(1)}
        if(d.type==="content_block_delta"&&d.delta&&d.delta.type==="thinking_delta"&&D.pensando===undefined){D.pensando=((Date.now()-D.at)/1000).toFixed(1)}
        if(d.type==="content_block_delta"&&d.delta&&d.delta.type==="text_delta"){if(D.escrevendo===undefined)mark("escrevendo"); text+=d.delta.text; if(opts.onText){try{opts.onText({text,delta:d.delta.text})}catch(e){}}}
        else if(d.type==="message_delta"&&d.delta&&d.delta.stop_reason==="max_tokens") truncated=true;
        else if(d.type==="message_delta"&&d.delta&&d.delta.stop_reason==="refusal"&&!text.trim()) throw {code:"refused",detail:"a IA recusou processar este texto"};
        else if(d.type==="error") throw {code:d.error&&d.error.type==="overloaded_error"?"rate_limited":"upstream_error",text,detail:"IA · "+((d.error&&(d.error.message||d.error.type))||"erro")};
      }
    }
  }catch(e){ if(e&&e.name==="AbortError") throw {code:"cancelled",text}; if(e&&e.code) throw e; throw {code:"upstream_error",text,detail:"a conexão caiu no meio da resposta"} }

  if(!text.trim()) throw {code:"empty_completion",detail:"a IA não devolveu texto"};
  return {text,truncated};
}
function parseJSONLoose(t){
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=Math.min(...["{","["].map(c=>{const i=t.indexOf(c);return i<0?Infinity:i})), b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a<b){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  return undefined;
}

const P=new Map();               // pid -> objeto
const pending=new Map(), timers={}, writing={};
async function upsertPatient(pid,p){const {error}=await SB.from("patients").upsert({id:pid,user_id:UID,data:p,updated_at:new Date().toISOString()});if(error)throw error}
function save(pid,patch,delay){
  const p=P.get(pid); if(!p) return;
  P.set(pid,deepMerge(p,patch));
  if(!persist) return;
  pending.set(pid,deepMerge(pending.get(pid)||{},patch));
  clearTimeout(timers[pid]); timers[pid]=setTimeout(()=>flush(pid),delay==null?700:delay);
}
async function flush(pid){
  if(writing[pid]){clearTimeout(timers[pid]);timers[pid]=setTimeout(()=>flush(pid),400);return}
  const patch=pending.get(pid); if(!patch) return; pending.delete(pid);
  const cur=P.get(pid); if(!cur) return;
  const doc={...cur,updatedAt:Date.now()}; P.set(pid,doc);
  writing[pid]=true;
  try{ await upsertPatient(pid,doc); if($("banner").dataset.save){showBanner("");delete $("banner").dataset.save} }
  catch(e){ showBanner("Sem conexão para salvar. A alteração fica guardada e será enviada de novo em instantes."); $("banner").dataset.save="1"; pending.set(pid,deepMerge(patch,pending.get(pid)||{})); clearTimeout(timers[pid]); timers[pid]=setTimeout(()=>flush(pid),5000); }
  finally{ writing[pid]=false; if(pending.has(pid)){clearTimeout(timers[pid]);timers[pid]=setTimeout(()=>flush(pid),700)} }
}

async function pdfLib(){
  if(!window.pdfjsLib){ await loadScript(PDFJS+"pdf.worker.min.js"); await loadScript(PDFJS+"pdf.min.js"); }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";
  return window.pdfjsLib;
}
async function readPdf(file,maxImgs){
  const lib=await pdfLib();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let text="";
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i); const c=await pg.getTextContent();
    let lastY=null,line="";
    c.items.forEach(it=>{const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>2){text+=line.trim()+"\n";line=""}line+=it.str+" ";lastY=y});
    text+=line.trim()+"\n\n";
  }
  if(text.replace(/\s/g,"").length>40) return {text};
  // PDF escaneado: vira imagem
  const imgs=[];
  for(let i=1;i<=Math.min(doc.numPages,maxImgs||4);i++){
    const pg=await doc.getPage(i); const vp=pg.getViewport({scale:1.6});
    const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    imgs.push(await new Promise(r=>cv.toBlob(r,"image/png")));
  }
  return {images:imgs};
}

async function readCensus(file,paste,st,prev,go){
  const files=[...(file.files||[])], txt=paste.value.trim();
  if(!files.length&&!txt){st.className="status err";st.textContent="Escolha um arquivo ou cole o texto do censo.";return}
  const sample=await sampleP; if(!sample){st.className="status err";st.textContent="Entre na sua conta para usar a IA.";return}
  go.disabled=true; prev.textContent=""; const all=[];
  try{
    const lim=await sample.limits().catch(()=>null); const imgOk=!!(lim&&lim.images); const maxImgs=imgOk?lim.images.maxCount:0;
    const jobs=[]; if(txt) jobs.push({name:"texto colado",get:async()=>({text:txt})});
    files.forEach(f=>{
      const n=f.name.toLowerCase();
      if(n.endsWith(".pdf")) jobs.push({name:f.name,get:()=>readPdf(f,maxImgs)});
      else if(/\.(xlsx|xls|csv)$/.test(n)) jobs.push({name:f.name,get:()=>/\.csv$/.test(n)?f.text().then(t=>({text:t})):readSheet(f)});
      else if(/^image\//.test(f.type)) jobs.push({name:f.name,get:async()=>({images:[f]})});
      else jobs.push({name:f.name,get:()=>f.text().then(t=>({text:t}))});
    });
    for(let i=0;i<jobs.length;i++){
      const j=jobs[i]; st.className="status thinking"; st.textContent="Lendo "+j.name+(jobs.length>1?" ("+(i+1)+" de "+jobs.length+")":"");
      const c=await j.get();
      let r;
      if(c.images&&c.images.length){
        if(!imgOk) throw {code:"images_unavailable"};
        r=await sample.json(censusPrompt(j.name)+"\n\nO censo está nas imagens anexadas.",{images:c.images.slice(0,maxImgs),cache:false});
      } else {
        r=await sample.json(censusPrompt(j.name)+"\n\nCENSO:\n\"\"\"\n"+String(c.text||"").slice(0,120000)+"\n\"\"\"",{cache:false,modelTier:"quick"});
      }
      (r&&Array.isArray(r.pacientes)?r.pacientes:[]).forEach(x=>{ if(x&&x.nome) all.push(x) });
    }
    if(!all.length){st.className="status err";st.textContent="Não encontrei pacientes nesse censo. Confira o arquivo ou cole o texto.";return}
    // remove duplicados (mesmo nome)
    const seen=new Map(); all.forEach(x=>{const k=normName(x.nome);if(!seen.has(k))seen.set(k,x)});
    buildCensusRows([...seen.values()]);
    st.className="status"; st.textContent=seen.size+" pacientes encontrados. Confira e confirme.";
    renderCensusPreview();
  }catch(e){ st.className="status err"; st.textContent=e&&e.code==="images_unavailable"?"Este aparelho não consegue enviar imagens ao Claude. Use o PDF com texto, a planilha ou cole o texto.":(e&&e.message==="load")?"Não consegui abrir o leitor de PDF/planilha. Cole o texto do censo.":errMsg(e); }
  finally{ go.disabled=false; }
}
function buildCensusRows(list){
  const existing=[...P.entries()].map(([id,p])=>({id,p,k:normName(p.nome)}));
  censusRows=list.map(x=>{
    const k=normName(x.nome); const m=existing.find(e=>e.k===k);
    const leito=String(x.leito||"").trim();
    return {x,leito,match:m?m.id:null,changes:m?[m.p.leito!==leito&&leito?"leito "+(m.p.leito||"-")+" → "+leito:null,(m.p.status||"ativo")!=="ativo"?"volta para internados":null].filter(Boolean):[],on:true};
  });
  const inCensus=new Set(censusRows.filter(r=>r.match).map(r=>r.match));
  censusGone=existing.filter(e=>(e.p.status||"ativo")==="ativo"&&!inCensus.has(e.id)).map(e=>({id:e.id,p:e.p,on:false}));
}

function apoioPrompt(p){
  const e=p.evo||{}; const aa=autoAlerts(p);
  return `Você é um médico hospitalista experiente de enfermaria de clínica médica, atuando como apoio ao raciocínio clínico de um colega. Analise os dados do paciente abaixo e aponte o que ajuda a decisão de hoje.

Responda apenas com JSON neste formato:
{"resumo":"1 a 2 frases com o raciocínio principal do caso hoje","itens":[{"tipo":"redflag"|"inconsistencia"|"investigar"|"lembrar"|"diferencial","prioridade":"alta"|"media"|"baixa","titulo":"curto, até 10 palavras","detalhe":"1 a 2 frases, citando os dados que sustentam","acao":"o que fazer, curto e objetivo","fonte":"diretriz, consenso ou escore que sustenta, com sociedade e ano","pubmed":"termo de busca curto em inglês para conferir no PubMed"}]}

O que cada tipo significa:
- redflag: sinal de gravidade ou deterioração que pede ação hoje.
- inconsistencia: dados que se contradizem no registro (ex.: exame físico sem edema e texto citando edema; dispositivo marcado e não citado; dose incompatível com a função renal; antibiótico sem foco ou cultura correspondente; diagnóstico sem dado que o sustente; possível erro de copiar e colar).
- investigar: exame ou avaliação que falta e mudaria a conduta.
- lembrar: segurança e cuidados que costumam ser esquecidos (profilaxias, ajuste renal, interações, desmame de dispositivos e O2, reconciliação, conversa sobre objetivos de cuidado, planejamento de alta).
- diferencial: hipótese alternativa plausível que ainda não foi considerada nos dados.

Regras:
- Só aponte o que tem base nos dados fornecidos; cite o dado no detalhe. Não invente exames, sinais ou comorbidades.
- Toda recomendação deve se apoiar em evidência consolidada: diretrizes de sociedades reconhecidas (ex.: KDIGO, IDSA, Surviving Sepsis, ACCP/CHEST, ASH, ESC, AHA/ACC, ADA, GOLD, GINA, BTS, NICE, AGS Beers, SBC, SBPT, AMIB, SBN, SBD, ANCP), revisões sistemáticas ou escores validados. Em "fonte", nomeie a diretriz ou o escore com a sociedade e o ano, do jeito que você tem certeza que existe; nunca invente título, ano ou número de recomendação. Se o ponto for só boa prática sem diretriz específica, escreva "Prática clínica consolidada". Se não houver base sólida, não inclua o item.
- Prefira as diretrizes brasileiras quando existirem e forem equivalentes.
- Seja conservador e proporcional: considere idade, fragilidade, prognóstico e contexto paliativo. Evite excesso de exames e medicalização.
- Use escores e classificações quando aplicável (KDIGO, qSOFA, CURB-65, Padua, Caprini, 4Ts, CHA2DS2-VASc, HAS-BLED, Child-Pugh, PPS, CAM).
- No máximo 10 itens, do mais importante para o menos. Não repita o que já está claramente resolvido no plano.
- Os alertas automáticos abaixo já foram mostrados ao médico; não os repita, a menos que acrescente algo novo.
- Português do Brasil, linguagem de colega para colega, sem travessão.

${patientContext(p)}

ALERTAS AUTOMÁTICOS JÁ MOSTRADOS:
${aa.length?aa.map(a=>"- "+a.t).join("\n"):"(nenhum)"}

EVOLUÇÃO DE HOJE ${e.out?"(organizada)":"(ainda não organizada; texto do médico)"}:
"""
${e.out||e.raw||"(sem evolução de hoje)"}
"""${e.alerts?`

ANÁLISE CRÍTICA DA EVOLUÇÃO:
"""
${e.alerts}
"""`:""}`;
}

async function startSession(session){
  UID=session.user.id; persist=true; gate=null; sampleP=Promise.resolve(sampleFn);
  $("acct").hidden=false; $("acctEmail").textContent=session.user.email||"";
  try{const {data}=await SB.from("settings").select("data").eq("user_id",UID).maybeSingle();const d=data&&data.data;if(d&&Array.isArray(d.templates)&&d.templates.length){templates=clone(d.templates);try{localStorage.setItem(LS_T,JSON.stringify(templates))}catch(e){}}}catch(e){}
  try{ await loadAll() }catch(e){ showBanner("Não consegui carregar seus pacientes. Confira a internet e se o banco foi criado (passo 2 do guia).") }
  render();
  if(!rtChannel){
    rtChannel=SB.channel("pacientes-"+UID).on("postgres_changes",{event:"*",schema:"public",table:"patients"},pl=>{
      if(pl.eventType==="DELETE"){const id=pl.old&&pl.old.id; if(id&&P.has(id)&&!pending.has(id)&&!writing[id]) P.delete(id)}
      else if(pl.new&&pl.new.user_id===UID) applyRow(pl.new.id,pl.new.data);
      refreshFromRemote();
    }).subscribe();
  }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&persist){ loadAll().then(refreshFromRemote).catch(()=>{}) } });
window.addEventListener("online",()=>{ if(persist){ [...pending.keys()].forEach(pid=>flush(pid)); loadAll().then(refreshFromRemote).catch(()=>{}) } });
$("logoutBtn").onclick=async()=>{ for(const pid of [...pending.keys()]){ clearTimeout(timers[pid]); await flush(pid) } try{await SB.auth.signOut()}catch(e){} location.reload() };

// ===================== inicialização =====================
(async()=>{
  render();
  const cfg=getCfg();
  if(!cfg){ gate="setup"; render(); return }
  if(!window.supabase||!window.supabase.createClient){ gate="login"; showBanner("Não consegui carregar o Supabase. Confira a internet e recarregue a página."); render(); return }
  SB=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,lock:async(n,t,fn)=>await fn()}});
  try{ SB.auth.onAuthStateChange((ev,s)=>{ CUR_SESSION=s||null }) }catch(e){}
  let session=null;
  try{ ({data:{session}}=await SB.auth.getSession()) }catch(e){}
  if(!session){ gate="login"; render(); return }
  await startSession(session);
})();
})();
</script>
